name: Deploy to Firebase Hosting

# Every change pushed to main goes live automatically.
# One-time setup (one GitHub secret) is explained in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the project ID from the service account key
        id: pid
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT. See 'Automatic deploy' in README.md."
            exit 1
          fi
          PID=$(printf '%s' "$SA" | jq -r '.project_id // empty')
          if [ -z "$PID" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT does not look like a Firebase key file (no project_id). Paste the whole .json file."
            exit 1
          fi
          echo "id=$PID" >> "$GITHUB_OUTPUT"
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Check the admin email for the order system
        id: orders
        run: |
          # One admin email per line. Every email listed gets full admin rights.
          EMAILS=$(tr -d ' \r' < admin-email.txt 2>/dev/null | grep -v '^$' || true)
          OK=true
          [ -n "$EMAILS" ] || OK=false
          for E in $EMAILS; do
            printf '%s' "$E" | grep -Eq '^[^@'"'"' ]+@[^@'"'"' ]+\.[^@'"'"' ]+$' || OK=false
          done
          if [ "$OK" = true ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            # Becomes the inside of the rules list: a', 'b
            echo "email=$(printf '%s\n' $EMAILS | paste -sd, - | sed "s/,/', '/g")" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::admin-email.txt is missing or has a line that is not an email. The website is deployed without the order system."
          fi

      - name: Set up the order system (web app, database)
        if: steps.orders.outputs.on == 'true'
        run: |
          pip install --quiet google-auth requests
          python3 scripts/provision.py

      - name: Prepare security rules
        if: steps.orders.outputs.on == 'true'
        env:
          ADMIN_EMAIL: ${{ steps.orders.outputs.email }}
        run: |
          sed -i "s/__ADMIN_EMAIL__/${ADMIN_EMAIL//\//\\/}/" firestore.rules
          grep -c "__ADMIN_EMAIL__" firestore.rules && exit 1 || true

      - name: Deploy
        env:
          PID: ${{ steps.pid.outputs.id }}
          ORDERS: ${{ steps.orders.outputs.on }}
        run: |
          FB="npx --yes firebase-tools@13.35.1"
          if [ "$ORDERS" != "true" ]; then
            git checkout -- firebase-config.js
            $FB deploy --only hosting --project "$PID" --non-interactive
            exit 0
          fi
          # If the shop owner publishes the rules by hand in the Firebase console, the file
          # rules-manual.txt exists and only the website is deployed (with the order form on).
          if [ -f rules-manual.txt ]; then
            $FB deploy --only hosting --project "$PID" --non-interactive
            exit 0
          fi
          if $FB deploy --only hosting,firestore:rules --project "$PID" --non-interactive; then
            exit 0
          fi
          echo "::error::The security rules could not be published, so the order form stays switched off. The website itself is still updated."
          pip install --quiet google-auth requests
          python3 scripts/diagnose.py || true
          git checkout -- firebase-config.js
          $FB deploy --only hosting --project "$PID" --non-interactive
          exit 1
