name: Deploy to Firebase Hosting

# Every change pushed to main goes live automatically.
# One-time setup (two GitHub secrets) is explained in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the Firebase secrets are set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SA" ] || [ -z "$PID" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID. See 'Automatic deploy' in README.md."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
