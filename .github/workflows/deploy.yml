name: Deploy to Firebase Hosting

# Every change pushed to main goes live automatically.
# One-time setup (one GitHub secret) is explained in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Read the project ID from the service account key
        id: pid
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT. See 'Automatic deploy' in README.md."
            exit 1
          fi
          PID=$(printf '%s' "$SA" | jq -r '.project_id // empty')
          if [ -z "$PID" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT does not look like a Firebase key file (no project_id). Paste the whole .json file."
            exit 1
          fi
          echo "id=$PID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ steps.pid.outputs.id }}
          channelId: live
